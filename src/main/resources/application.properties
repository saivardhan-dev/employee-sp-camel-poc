# Oracle AQ
oracle.aq.schema=EMPUSER
oracle.aq.subscriber=ORA_EDICUSTOMSCTMSSUBSCRIBER

# ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

# Oracle DB
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=empuser
spring.datasource.password=empuser123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Camel
camel.springboot.name=ShippingCtmsAqJms
camel.springboot.main-run-controller=true

# Force ConsumerType to Custom for Oracle AQ
camel.component.jms.consumer-type=Custom

spring.jms.enabled=false
spring.activemq.embedded.enabled=false